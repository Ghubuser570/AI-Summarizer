<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Project Atlas - Matrix Terminal</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>👑 Project Atlas: Matrix Terminal</h1>
        </header>

        <section class="upload-section">
            <h2>Vault Upload (MinIO & Redis)</h2>
            <input type="file" id="pdf-upload" accept="application/pdf">
            <button id="upload-btn">Secure File</button>
            <p id="upload-status"></p>
        </section>

        <section class="chat-section">
            <h2>AI Neural Interface</h2>
            <div id="chat-box" class="chat-box"></div>
            <div class="input-area">
                <input type="text" id="query-input" placeholder="Command the Matrix, Overlord...">
                <button id="ask-btn">Ask AI</button>
                <button id="search-btn">Raw Vector Search</button>
            </div>
        </section>
    </div>
    <script src="script.js"></script>
</body>
</html>
